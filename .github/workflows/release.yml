name: Build and publish

# Builds the Amazon Linux image for linux/amd64 and linux/arm64, publishes it to GHCR,
# signs it with cosign (keyless) and attests its build provenance.
#
# Based on xSAVIKx/aws-emulator-docker. Changes for TerraConstructs: GHCR only (no
# Docker Hub or Quay), the Amazon Linux variant only, no hourly upstream schedule (a
# new emulator version is published on purpose, by push or workflow_dispatch).

on:
  push:
    branches: [main]
    # Publish only when a file that goes into the image or its tests changes.
    paths: &image_paths
      - "Dockerfile"
      - ".dockerignore"
      - "healthcheck.sh"
      - "healthcheck/**"
      - "entrypoint/**"
      - "keys/**"
      - "tests/**"
      - ".github/workflows/release.yml"
  pull_request:
    paths: *image_paths
  workflow_dispatch:
    inputs:
      version:
        description: "Upstream package version, for example 1.0.598.1 (default: the newest downloadable)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE_NAME: aws-emulator
  GHCR_IMAGE: ghcr.io/terraconstructs/aws-emulator
  DOWNLOAD_BASE: https://downloads.aws.com/aws-emulator/packages/aws-emulator/LTS

jobs:
  resolve:
    name: Resolve upstream version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
      upstream_version: ${{ steps.v.outputs.upstream_version }}
      rpm_sha_amd64: ${{ steps.sha.outputs.rpm_sha_amd64 }}
      rpm_sha_arm64: ${{ steps.sha.outputs.rpm_sha_arm64 }}
      publish: ${{ steps.publish.outputs.publish }}
      created: ${{ steps.v.outputs.created }}
      build_tag: ${{ steps.v.outputs.build_tag }}
      base_name: ${{ steps.base.outputs.name }}
      base_digest: ${{ steps.base.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read the base image from the Dockerfile
        id: base
        shell: bash
        run: |
          set -euo pipefail
          ref=$(sed -n 's/^ARG BASE_IMAGE=//p' Dockerfile)
          echo "name=${ref%@*}" | tee -a "$GITHUB_OUTPUT"
          echo "digest=${ref#*@}" | tee -a "$GITHUB_OUTPUT"

      - name: Resolve upstream version
        id: v
        shell: bash
        env:
          REQUESTED: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ -n "${REQUESTED:-}" ]; then
            candidates="$REQUESTED"
          else
            candidates=$(curl -fsSL --retry 5 "$DOWNLOAD_BASE/versions.json" | jq -r '.versions[].version' | sort -Vr | head -5)
          fi
          # Take the newest valid version whose two packages are downloadable.
          upstream=""
          for cand in $candidates; do
            [[ "$cand" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::warning::Ignoring invalid version '$cand'"; continue; }
            v="${cand%.*}-${cand##*.}"; ok=true
            for f in "aws-emulator-$v-x86_64.rpm" "aws-emulator-$v-aarch64.rpm"; do
              code=$(curl -s -o /dev/null -I -w '%{http_code}' --retry 3 "$DOWNLOAD_BASE/$f")
              [ "$code" = 200 ] || { echo "::notice::$cand: $f returned $code"; ok=false; break; }
            done
            if [ "$ok" = true ]; then upstream="$cand"; break; fi
          done
          [ -n "$upstream" ] || { echo "::error::No downloadable version"; exit 1; }
          # Package version is like 1.0.322.1. The emulator reports 1.0.322.
          echo "upstream_version=$upstream" | tee -a "$GITHUB_OUTPUT"
          echo "version=$(cut -d. -f1-3 <<<"$upstream")" | tee -a "$GITHUB_OUTPUT"
          echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          # Immutable tag: one per build, never moved.
          echo "build_tag=$upstream-$(date -u +%Y%m%d).$GITHUB_RUN_NUMBER" | tee -a "$GITHUB_OUTPUT"

      - name: Decide whether to publish
        id: publish
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          publish=false
          case "$EVENT" in push|workflow_dispatch) publish=true ;; esac
          # Only the main branch publishes. Pull requests and other branches only build and test.
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then publish=false; fi
          echo "publish=$publish" | tee -a "$GITHUB_OUTPUT"

      - name: Checksums of the pinned packages
        id: sha
        if: steps.publish.outputs.publish == 'true' || github.event_name == 'pull_request'
        shell: bash
        env:
          UPSTREAM: ${{ steps.v.outputs.upstream_version }}
        run: |
          set -euo pipefail
          v="${UPSTREAM%.*}-${UPSTREAM##*.}"
          sha() { curl -fsSL --retry 5 --retry-all-errors "$DOWNLOAD_BASE/$1" | sha256sum | cut -d' ' -f1; }
          printf '### Upstream AWS Emulator %s\n| file | sha256 |\n|---|---|\n' "$UPSTREAM" >> "$GITHUB_STEP_SUMMARY"
          for spec in rpm_sha_amd64:aws-emulator-$v-x86_64.rpm rpm_sha_arm64:aws-emulator-$v-aarch64.rpm; do
            key=${spec%%:*}; file=${spec#*:}
            h=$(sha "$file")
            echo "$key=$h" >> "$GITHUB_OUTPUT"
            echo "| \`$file\` | \`$h\` |" >> "$GITHUB_STEP_SUMMARY"
          done

  build:
    name: Build ${{ matrix.platform }}
    needs: resolve
    if: needs.resolve.outputs.publish == 'true' || github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Prepare
        shell: bash
        run: echo "PLATFORM_PAIR=${PLATFORM//\//-}" >> "$GITHUB_ENV"
        env:
          PLATFORM: ${{ matrix.platform }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.GHCR_IMAGE }}
          labels: &labels |
            org.opencontainers.image.title=AWS Emulator (TerraConstructs)
            org.opencontainers.image.description=Multi-arch container image of the AWS Emulator for TerraConstructs integration tests. Based on xSAVIKx/aws-emulator-docker. Unofficial build.
            org.opencontainers.image.vendor=TerraConstructs
            org.opencontainers.image.version=${{ needs.resolve.outputs.upstream_version }}
            org.opencontainers.image.created=${{ needs.resolve.outputs.created }}
            org.opencontainers.image.licenses=Apache-2.0 AND CC0-1.0
            org.opencontainers.image.documentation=https://github.com/${{ github.repository }}#readme
            org.opencontainers.image.base.name=${{ needs.resolve.outputs.base_name }}
            org.opencontainers.image.base.digest=${{ needs.resolve.outputs.base_digest }}
            org.opencontainers.image.url=https://github.com/${{ github.repository }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            io.github.aws.aws-emulator.version=${{ needs.resolve.outputs.upstream_version }}
            io.github.aws.aws-emulator.source=https://github.com/aws/aws-emulator

      - name: Build for test
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          load: true
          tags: ${{ env.IMAGE_NAME }}:ci
          labels: ${{ steps.meta.outputs.labels }}
          file: Dockerfile
          build-args: |
            EMULATOR_VERSION=${{ needs.resolve.outputs.upstream_version }}
            RPM_SHA256_AMD64=${{ needs.resolve.outputs.rpm_sha_amd64 }}
            RPM_SHA256_ARM64=${{ needs.resolve.outputs.rpm_sha_arm64 }}
          cache-from: type=gha,scope=${{ env.PLATFORM_PAIR }}
          cache-to: ${{ github.event_name != 'pull_request' && format('type=gha,mode=max,scope={0}', env.PLATFORM_PAIR) || '' }}

      - name: Smoke test
        shell: bash
        run: ./tests/smoke.sh "${IMAGE_NAME}:ci"

      - name: TLS front end test
        shell: bash
        run: ./tests/tls.sh "${IMAGE_NAME}:ci"

      - name: Log in to GHCR
        if: needs.resolve.outputs.publish == 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push by digest
        id: build
        if: needs.resolve.outputs.publish == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          file: Dockerfile
          build-args: |
            EMULATOR_VERSION=${{ needs.resolve.outputs.upstream_version }}
            RPM_SHA256_AMD64=${{ needs.resolve.outputs.rpm_sha_amd64 }}
            RPM_SHA256_ARM64=${{ needs.resolve.outputs.rpm_sha_arm64 }}
          outputs: type=image,name=${{ env.GHCR_IMAGE }},push-by-digest=true,name-canonical=true,push=true
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=${{ env.PLATFORM_PAIR }}

      - name: Export digest
        if: needs.resolve.outputs.publish == 'true'
        shell: bash
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"

      - name: Upload digest
        if: needs.resolve.outputs.publish == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish manifest
    needs: [resolve, build]
    if: needs.resolve.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write        # cosign keyless signing and attestations
      attestations: write
    outputs:
      digest: ${{ steps.digest.outputs.digest }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: index
        with:
          images: ${{ env.GHCR_IMAGE }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=${{ needs.resolve.outputs.build_tag }}${{ github.run_attempt > 1 && format('.{0}', github.run_attempt) || '' }}
            type=raw,value=${{ needs.resolve.outputs.upstream_version }}
            type=raw,value=${{ needs.resolve.outputs.version }}
            type=raw,value=latest
            type=sha,format=short,prefix=sha-
          labels: *labels

      - name: Create and push the manifest list
        shell: bash
        working-directory: ${{ runner.temp }}/digests
        env:
          TAGS_JSON: ${{ steps.meta.outputs.json }}
        run: |
          set -euo pipefail
          n=$(find . -maxdepth 1 -type f | wc -l)
          [ "$n" -eq 2 ] || { echo "::error::Expected 2 platform digests, found $n"; exit 1; }
          args=()
          while IFS= read -r t; do args+=(-t "$t"); done < <(jq -r '.tags[]' <<<"$TAGS_JSON")
          while IFS= read -r a; do args+=(--annotation "$a"); done < <(jq -r '.annotations[]' <<<"$TAGS_JSON")
          for d in *; do args+=("$GHCR_IMAGE@sha256:$d"); done
          docker buildx imagetools create "${args[@]}"

      - name: Inspect
        id: digest
        shell: bash
        run: |
          set -euo pipefail
          docker buildx imagetools inspect "$GHCR_IMAGE:sha-${GITHUB_SHA::7}"
          digest=$(docker buildx imagetools inspect "$GHCR_IMAGE:sha-${GITHUB_SHA::7}" --format '{{json .Manifest}}' | jq -r .digest)
          echo "digest=$digest" | tee -a "$GITHUB_OUTPUT"

      - name: Sign the image with cosign (keyless)
        shell: bash
        env:
          DIGEST: ${{ steps.digest.outputs.digest }}
        run: cosign sign --yes "$GHCR_IMAGE@$DIGEST"

      - name: GitHub build provenance attestation (GHCR)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.GHCR_IMAGE }}
          subject-digest: ${{ steps.digest.outputs.digest }}
          push-to-registry: true

      - name: Summary
        shell: bash
        env:
          TAGS_JSON: ${{ steps.meta.outputs.json }}
          DIGEST: ${{ steps.digest.outputs.digest }}
        run: |
          {
            echo "### Published"
            echo "Digest: \`$DIGEST\`"
            jq -r '.tags[] | "- `" + . + "`"' <<<"$TAGS_JSON"
          } >> "$GITHUB_STEP_SUMMARY"

  release:
    name: GitHub release notes
    needs: [resolve, publish]
    if: needs.resolve.outputs.publish == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      UPSTREAM: ${{ needs.resolve.outputs.upstream_version }}
      VERSION: ${{ needs.resolve.outputs.version }}
      BUILD_TAG: ${{ needs.resolve.outputs.build_tag }}${{ github.run_attempt > 1 && format('.{0}', github.run_attempt) || '' }}
      CREATED: ${{ needs.resolve.outputs.created }}
      DIGEST: ${{ needs.publish.outputs.digest }}
      RPM_AMD64: ${{ needs.resolve.outputs.rpm_sha_amd64 }}
      RPM_ARM64: ${{ needs.resolve.outputs.rpm_sha_arm64 }}
    steps:
      - name: Write release notes
        shell: bash
        run: |
          set -euo pipefail
          v="${UPSTREAM%.*}-${UPSTREAM##*.}"
          {
            echo "AWS Emulator **$UPSTREAM** (emulator \`$VERSION\`), built $CREATED for \`linux/amd64\` and \`linux/arm64\`."
            echo
            echo "### Pin"
            echo
            echo "The build tag \`$BUILD_TAG\` never moves."
            echo
            echo '```sh'
            echo "docker pull $GHCR_IMAGE:$UPSTREAM@$DIGEST"
            echo '```'
            echo
            echo "### Verified upstream packages"
            echo
            echo "| File | SHA-256 |"
            echo "|---|---|"
            echo "| \`aws-emulator-$v-x86_64.rpm\` | \`$RPM_AMD64\` |"
            echo "| \`aws-emulator-$v-aarch64.rpm\` | \`$RPM_ARM64\` |"
            echo
            echo "Signatures were checked against the AWS package signing key \`98BC F336 A3BE 53B7 34E9 67C5 2E5B F49B D940 F624\`."
            echo
            echo "### Verify"
            echo
            echo '```sh'
            echo "cosign verify $GHCR_IMAGE@$DIGEST \\"
            echo "  --certificate-identity 'https://github.com/$GITHUB_REPOSITORY/.github/workflows/release.yml@refs/heads/main' \\"
            echo "  --certificate-oidc-issuer https://token.actions.githubusercontent.com"
            echo '```'
          } > notes.md
          cat notes.md >> "$GITHUB_STEP_SUMMARY"

      - name: Create or update the release
        shell: bash
        run: |
          set -euo pipefail
          tag="v$UPSTREAM"
          if gh release view "$tag" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$tag" -R "$GITHUB_REPOSITORY" --notes-file notes.md --title "AWS Emulator $UPSTREAM"
          else
            gh release create "$tag" -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "AWS Emulator $UPSTREAM" --notes-file notes.md --latest
          fi
