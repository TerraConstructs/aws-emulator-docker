name: Docker Hub description

on:
  push:
    branches: [main]
    paths:
      - README.md
      - .github/workflows/dockerhub.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  description:
    runs-on: ubuntu-24.04
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.DOCKERHUB_USERNAME != ''
        with:
          persist-credentials: false
      - uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa # v5.0.0
        if: env.DOCKERHUB_USERNAME != ''
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ vars.DOCKERHUB_NAMESPACE || secrets.DOCKERHUB_USERNAME }}/aws-emulator
          short-description: Multi-arch (amd64/arm64) image of the AWS Emulator, a local emulator of the AWS APIs.
          readme-filepath: ./README.md
          enable-url-completion: true
      - name: Set the Docker Hub categories
        if: env.DOCKERHUB_USERNAME != ''
        shell: bash
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          REPO: ${{ vars.DOCKERHUB_NAMESPACE || secrets.DOCKERHUB_USERNAME }}/aws-emulator
        run: |
          set -euo pipefail
          jwt=$(jq -n --arg u "$DOCKERHUB_USERNAME" --arg p "$DOCKERHUB_TOKEN" '{username:$u,password:$p}' \
            | curl -fsS -H 'Content-Type: application/json' -d @- https://hub.docker.com/v2/users/login | jq -r .token)
          echo "::add-mask::$jwt"
          curl -fsS -X PATCH -H "Authorization: Bearer $jwt" -H 'Content-Type: application/json' \
            -d '[{"name":"Developer tools","slug":"developer-tools"},{"name":"Integration & delivery","slug":"integration-and-delivery"}]' \
            "https://hub.docker.com/v2/repositories/$REPO/categories/" | jq -c .
          curl -fsS "https://hub.docker.com/v2/repositories/$REPO/" | jq -c '.categories'
